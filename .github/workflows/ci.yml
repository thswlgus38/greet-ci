name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
          python-version: ${{ matrix.python }}
      - name: Create lockfile if missing
        run: uv lock
      - name: Run pytest
        run: uv run pytest -q
        continue-on-error: true

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
          python-version: "3.12"
      - name: Create lockfile if missing
        run: uv lock
      - name: Check formatting
        run: uv run black --check .
        continue-on-error: true
      - name: Check lint
        run: uv run flake8 .
        continue-on-error: true
      - name: Check types
        run: uv run mypy .
        continue-on-error: true

  build:
    name: Build package
    needs: [tests, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
          python-version: "3.12"
      - name: Create lockfile if missing
        run: uv lock
      - name: Build distributions
        run: uv build
      - name: Save distributions
        uses: actions/upload-artifact@v4
        with:
          name: greet-dist
          path: dist/*
          if-no-files-found: warn
